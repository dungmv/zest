[package]
name = "zest"
version = "0.1.0"
edition = "2021"

[dependencies]
zest-core = { path = "../core" }
gpui-kit = { version = "0.10.0", features = ["component", "assets"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4" }
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
url = "2.5"
rfd = "0.15"
lsp-types = { version = "0.97.0", features = ["proposed"] }
quick-xml = "0.41"
dirs = "6.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"

# Used only by the `#[cfg(target_os = "windows")]` block in build.rs (icon
# embedding); target-gating it keeps cargo's `unused_dependencies` lint quiet
# on Linux/macOS, where CI denies warnings via `CARGO_BUILD_WARNINGS=deny`.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
protox = "0.10"
prost = "0.14"
tempfile = "3.10"
gpui-kit = { version = "0.10.0", features = ["test-support"] }
